<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Amostra de papel archival e selo físico">
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9aa91"/><stop offset=".5" stop-color="#ded2bb"/><stop offset="1" stop-color="#9f9078"/></linearGradient>
 <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#242321"/><stop offset="1" stop-color="#0e0f0e"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2b2017"/><stop offset=".5" stop-color="#76553a"/><stop offset="1" stop-color="#211913"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#f0d4a0" stop-opacity=".65"/><stop offset="1" stop-color="#f0d4a0" stop-opacity="0"/></radialGradient>
 <pattern id="fiber" width="17" height="17" patternUnits="userSpaceOnUse"><path d="M0 4L17 12M4 0L12 17" stroke="#5f5649" stroke-opacity=".10" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="900" fill="#090a09"/>
<rect x="120" y="90" width="1360" height="720" rx="18" fill="url(#mat)"/>
<rect x="220" y="150" width="1160" height="570" rx="8" fill="url(#paper)" transform="rotate(-2 800 435)"/>
<rect x="220" y="150" width="1160" height="570" rx="8" fill="url(#fiber)" opacity=".8" transform="rotate(-2 800 435)"/>
<ellipse cx="1020" cy="250" rx="470" ry="300" fill="url(#light)"/>
<!-- blank deterministic Ω1 composition field -->
<rect x="490" y="270" width="620" height="300" rx="12" fill="#d5c7ad" fill-opacity=".14" stroke="#5c5143" stroke-opacity=".18" stroke-width="2"/>
<!-- physical seal and ink dish -->
<g transform="translate(1180 570)">
 <rect x="-75" y="-45" width="150" height="80" rx="10" fill="url(#wood)" stroke="#171310" stroke-width="7"/>
 <rect x="-48" y="-115" width="96" height="80" rx="9" fill="#5a5146" stroke="#171817" stroke-width="8"/>
 <rect x="-35" y="-145" width="70" height="32" rx="7" fill="#777064"/>
</g>
<g transform="translate(320 640)">
 <ellipse rx="105" ry="52" fill="#161716" stroke="#4d4439" stroke-width="8"/>
 <ellipse rx="70" ry="30" fill="#080908"/>
</g>
<rect x="0" y="0" width="1600" height="900" fill="none" stroke="#070807" stroke-width="28"/>
</svg>
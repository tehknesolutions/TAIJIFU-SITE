<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">TAIJIFU ceremonial four-part mark</title><desc id="desc">Presentation mark for the official cinematic home: four adaptive forms in red, blue, gold and black around a golden center.</desc>

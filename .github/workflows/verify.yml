name: Verify

on:
  push:
    branches:
      - main
      - web-v1-personalized-training-spec
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run interactive-web tests
        run: pnpm --dir apps/interactive-web test -- --run

      - name: Build interactive-web
        run: pnpm --dir apps/interactive-web build

      - name: Upload verified web artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: taijifu-interactive-web
          path: apps/interactive-web/dist
          if-no-files-found: error
          retention-days: 14

name: Verify

on:
  push:
    branches:
      - main
      - web-v1-personalized-training-spec
  pull_request:

permissions:
  contents: read

jobs:
  interactive-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck interactive web
        run: pnpm --filter @taijifu/interactive-web typecheck

      - name: Test interactive web
        run: pnpm --filter @taijifu/interactive-web test

      - name: Build interactive web
        run: pnpm --filter @taijifu/interactive-web build

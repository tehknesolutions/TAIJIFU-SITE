name: TAIJIFU Interactive Web

on:
  push:
    branches:
      - feat/interactive-web-shell-v0.2
    paths:
      - 'apps/interactive-web/**'
      - '.github/workflows/interactive-web.yml'
  pull_request:
    paths:
      - 'apps/interactive-web/**'
      - '.github/workflows/interactive-web.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/interactive-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install isolated interactive-web dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

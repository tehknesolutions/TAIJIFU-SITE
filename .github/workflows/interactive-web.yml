name: TAIJIFU Interactive Web

on:
  push:
    branches:
      - main
      - feat/interactive-web-v1-runtime
    paths:
      - 'apps/interactive-web/**'
      - 'packages/design-tokens/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/interactive-web.yml'
  pull_request:
    paths:
      - 'apps/interactive-web/**'
      - 'packages/design-tokens/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/interactive-web.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @taijifu/interactive-web typecheck
      - name: Test
        run: pnpm --filter @taijifu/interactive-web test
      - name: Build
        run: pnpm --filter @taijifu/interactive-web build

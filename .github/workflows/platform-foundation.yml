name: TAIJIFU Platform Foundation

on:
  push:
    branches:
      - main
      - feat/platform-foundation-v1
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'platform/**'
      - 'tests/architecture/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.github/workflows/platform-foundation.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'platform/**'
      - 'tests/architecture/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.github/workflows/platform-foundation.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm architecture:test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc"><title id="title">TAIJIFU Ω1 Vector Candidate V2 — Optical Synthesis</title><desc id="desc">Three-gesture synthesis: martial AXIS, adaptive PORTAL, and asymmetric FLOW. HNK genealogy is encoded in junctions, terminals, cuts and negative space rather than stacked glyphs.</desc><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><!-- AXIS / NEXUS --><path stroke-width="64" d="M500 118 L500 858"/><path stroke-width="52" d="M432 186 L500 108 L568 186"/><!-- PORTAL / ORIGIN: deliberately incomplete --><path stroke-width="58" d="M705 318 C786 448 751 624 628 720 C536 792 404 797 310 728 C232 671 194 579 207 485 C219 398 268 323 340 277"/><!-- FLOW: one controlled adaptive gesture crossing the axis --><path stroke-width="56" d="M642 214 C487 246 389 333 401 424 C411 501 514 514 569 562 C632 617 607 710 493 780 C441 812 390 833 342 850"/></g><!-- nucleus and terminal logic --><circle cx="500" cy="500" r="34" fill="currentColor"/><circle cx="500" cy="108" r="18" fill="currentColor"/><path d="M500 858 L466 812 L534 812 Z" fill="currentColor"/></svg>